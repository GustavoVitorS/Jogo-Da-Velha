<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Jogo da Velha V2 com inteligência artificial estratégica, três níveis de dificuldade e interface responsiva."
    />
    <meta name="theme-color" content="#16001f" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23610094%22/><path d=%22M18 18l28 28m0-28L18 46%22 stroke=%22white%22 stroke-width=%227%22 stroke-linecap=%22round%22/></svg>" />
    <link rel="stylesheet" href="estilos.css" />
    <title>Jogo da Velha V2</title>
  </head>

  <body>
    <main class="page-shell">
      <header class="brand-bar" aria-label="Identificação do jogo">
        <a class="brand" href="#game" aria-label="Jogo da Velha V2 — início">
          <span class="brand__mark" aria-hidden="true">#</span>
          <span>JOGO DA VELHA <strong>V2</strong></span>
        </a>
      </header>

      <section class="game-card" id="game" aria-labelledby="game-title">
        <div class="game-card__heading">
          <div>
            <h1 id="game-title">Antecipe. Bloqueie. Vença.</h1>
            <p class="intro">Domine o tabuleiro antes que a IA transforme cada abertura em uma armadilha.</p>
          </div>

          <div class="symbol-key" aria-label="Você joga com X e a inteligência artificial joga com O">
            <span><b class="symbol-key__x">X</b> VOCÊ</span>
            <span><b class="symbol-key__o">O</b> IA</span>
          </div>
        </div>

        <fieldset class="difficulty" aria-label="Nível de dificuldade">
          <legend>DIFICULDADE</legend>
          <div class="difficulty__options">
            <label>
              <input type="radio" name="difficulty" value="casual" />
              <span>Casual</span>
            </label>
            <label>
              <input type="radio" name="difficulty" value="estrategica" checked />
              <span>Estratégica</span>
            </label>
            <label>
              <input type="radio" name="difficulty" value="implacavel" />
              <span>Implacável</span>
            </label>
          </div>
        </fieldset>

        <div class="game-area">
          <section class="board-panel" aria-label="Partida atual">
            <div class="turn-banner" id="turn-banner">
              <span class="turn-banner__dot" aria-hidden="true"></span>
              <span id="status" role="status" aria-live="polite">Sua vez — escolha uma casa</span>
            </div>

            <div class="board" id="board" role="grid" aria-label="Tabuleiro do jogo da velha">
              <button class="cell" type="button" role="gridcell" data-index="0" aria-label="Linha 1, coluna 1: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="1" aria-label="Linha 1, coluna 2: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="2" aria-label="Linha 1, coluna 3: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="3" aria-label="Linha 2, coluna 1: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="4" aria-label="Linha 2, coluna 2: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="5" aria-label="Linha 2, coluna 3: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="6" aria-label="Linha 3, coluna 1: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="7" aria-label="Linha 3, coluna 2: vazia"></button>
              <button class="cell" type="button" role="gridcell" data-index="8" aria-label="Linha 3, coluna 3: vazia"></button>
            </div>
          </section>

          <aside class="match-panel" aria-label="Placar e controles">
            <div>
              <p class="panel-label">PLACAR</p>
              <div class="scoreboard">
                <div class="score score--player">
                  <span>VOCÊ</span>
                  <strong id="score-player">0</strong>
                </div>
                <div class="score score--draw">
                  <span>EMPATES</span>
                  <strong id="score-draw">0</strong>
                </div>
                <div class="score score--ai">
                  <span>IA</span>
                  <strong id="score-ai">0</strong>
                </div>
              </div>
            </div>

            <div class="round-info">
              <span>RODADA</span>
              <strong id="round-number">01</strong>
              <p id="starter-note">Você começa esta rodada.</p>
            </div>

            <div class="actions">
              <button class="button button--primary" id="new-round" type="button">NOVA RODADA</button>
              <button class="button button--ghost" id="reset-score" type="button">ZERAR PLACAR</button>
            </div>
          </aside>
        </div>

      </section>
    </main>

    <script src="scripts.js"></script>
  </body>
</html>
